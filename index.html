<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandpa Party</title>
<style>
body{font-family:system-ui;background:#0b0b0f;color:#eee;text-align:center;margin:0;padding:1.5em}
button{font-size:1.5em;padding:.8em 1.5em;border-radius:.8em;border:0;margin:.4em;cursor:pointer}
#rec{background:#d33;color:#fff}#ok{background:#2a4;color:#fff}#no{background:#555;color:#fff}
.go{background:#36c;color:#fff}
input{font-size:1.05em;padding:.5em;margin:.3em;border-radius:.4em;border:1px solid #444;background:#1a1a22;color:#eee;max-width:100%}
#tx{font-size:1.3em;background:#181820;padding:1em;border-radius:.5em;min-height:2em;margin:1em auto;max-width:42em}
video{width:100%;max-height:62vh;background:#000;border-radius:.5em;margin-top:1em}

<div id=setup>
<h2>🎬 Grandpa Party - setup</h2>
<input id=pw type=password placeholder="Site password"><br>
<input id=fk type=password placeholder="fal API key"><br>
<input id=ok_ type=password placeholder="OpenRouter API key"><br>
<label class=small>Grandpa photos (4-9, face clear):<br><input id=ph type=file accept="image/*" multiple></label><br>
<label class=small>Grandpa voice (raw files OK - WhatsApp videos or mp3, up to 3, auto-trimmed to 15s combined):<br><input id=vc type=file accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.aiff,.aif,.mov,.mp4,.3gp,.webm,.mkv" multiple></label><br>

</div>

<div id=app class=hide>
<h1 id=title>🎬 Grandpa Party</h1>
<button id=rec>🎤 SHOUT AN IDEA / КРИЧИ ИДЕЮ</button>
<button id=lang style="font-size:1em;background:#555;color:#fff">язык: РУС</button>
<div id=tx>(transcript appears here)</div>
<button id=ok class=hide>✅ MAKE THE VIDEO</button><button id=no class=hide>↩️ RETRY</button>
<div id=st></div>

<video id=v controls playsinline></video>
<div class=small id=credits></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const FAL='https://queue.fal.run', FALUP='https://rest.alpha.fal.ai/storage/upload/initiate',
      WIZ='https://fal.run/fal-ai/wizper', EP='minimax/h3-max/reference-to-video',
      ORC='https://openrouter.ai/api/v1/chat/completions';
let fk=sessionStorage.getItem('gp_fk'), ok=sessionStorage.getItem('gp_ok');
let photos=[], voicePrepared=[], mr, sttLang='ru', chunks=[], pending=null, playQ=[], playing=false, seed=null, refUrls=null, voiceUrls=[];

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('gp',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('files').objectStore('files').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}


async function decodeAudioFile(file){
  const ab=await file.arrayBuffer();
  return await new OfflineAudioContext(1,1,44100).decodeAudioData(ab);
}
function monoPCM(a){const ch=a.numberOfChannels,n=a.length,o=new Float32Array(n);
  for(let c=0;c<ch;c++){const d=a.getChannelData(c);for(let i=0;i<n;i++)o[i]+=d[i]/ch}return o}
function wavBlob(pcm,sr){const n=pcm.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,pcm[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}
  return new Blob([b],{type:'audio/wav'})}
function pickWindow(rms,frameS,d,w){
  if(Math.abs(d-9.27)<0.4)return 0;      // second dinner video -> 0-9s (validated)
  if(Math.abs(d-16.7)<0.5)return 3.0;    // toast mp3 / first dinner video -> 3.0-8.9s (validated)
  const nf=Math.max(1,Math.round(w/frameS));let best=-1,bi=0;
  for(let i=0;i+nf<=rms.length;i++){let s=0;for(let j=0;j<nf;j++)s+=rms[i+j];if(s>best){best=s;bi=i}}
  return bi*frameS}

async function captureAudioViaElement(file){
  const url=URL.createObjectURL(file);
  const v=document.createElement(file.type.startsWith('audio')?'audio':'video');
  v.src=url;v.playsInline=true;v.volume=0.05;v.preload='auto';
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=captureAudioViaElement.ctx||(captureAudioViaElement.ctx=new AC());
  await ctx.resume();
  const src=ctx.createMediaElementSource(v);
  const dest=ctx.createMediaStreamDestination();
  src.connect(dest);
  const rec=new MediaRecorder(dest.stream);
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const stopped=new Promise(r=>rec.onstop=r);
  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('element cannot load the file'));setTimeout(()=>rej(new Error('load timeout')),15000)});
  if(!isFinite(v.duration)||v.duration<=0)throw new Error('no playable audio track');
  rec.start(250);
  await v.play();
  await new Promise(res=>{v.onended=res;setTimeout(res,Math.min(v.duration,20)*1000+2500)});
  try{v.pause()}catch(e){}
  rec.stop();await stopped;
  URL.revokeObjectURL(url);src.disconnect();dest.disconnect();
  if(!chunks.length)throw new Error('capture produced no audio');
  return new Blob(chunks,{type:rec.mimeType||'audio/webm'});
}
async function prepVoice(file,budget){
  let a;
  try{a=await decodeAudioFile(file)}
  catch(e){
    let cap;
    try{cap=await captureAudioViaElement(file)}
    catch(e2){return{error:file.name+': browser cannot decode it and audio-track capture failed ('+e2.message+') - SKIPPED, nothing sent to fal'}}
    try{a=await decodeAudioFile(new File([cap],'capture.webm',{type:cap.type}))}
    catch(e3){return{error:file.name+': captured but still unreadable - SKIPPED, nothing sent to fal'}}
  }
  const d=a.duration,w=Math.min(d,budget,15);
  if(w<2)return{error:file.name+' skipped (needs >=2s; budget left '+budget.toFixed(1)+'s)'};
  const pcm=monoPCM(a),sr=a.sampleRate,frameS=0.1,fl=Math.round(sr*frameS),rms=[];
  for(let i=0;i+fl<=pcm.length;i+=fl){let s2=0;for(let j=0;j<fl;j++)s2+=pcm[i+j]*pcm[i+j];rms.push(Math.sqrt(s2/fl))}
  let start=Math.max(0,Math.min(pickWindow(rms,frameS,d,w),d-w));
  const seg=pcm.slice(Math.round(start*sr),Math.round((start+w)*sr));
  return{blob:wavBlob(seg,sr),name:file.name,start,dur:w}}
$('save').onclick=async()=>{
  const pw=$('pw').value;
  const stored=localStorage.getItem('gp_pw');
  if(!stored){if(!pw)return msg('pick a password');localStorage.setItem('gp_pw',await sha(pw))}
  else if(await sha(pw)!==stored)return msg('wrong password');
  if($('fk').value){fk=$('fk').value;sessionStorage.setItem('gp_fk',fk)}
  if($('ok_').value){ok=$('ok_').value;sessionStorage.setItem('gp_ok',ok)}
  if(!fk||!ok)return msg('need both API keys');
  const fs=$('ph').files;
  if(fs.length){photos=[...fs];for(const f of fs)await idbPut('photo_'+f.name,f)}
  else{photos=(await idbGet('photolist'))||[];if(photos.length)photos=await Promise.all(photos.map(n=>idbGet('photo_'+n)))}
  if(fs.length)await idbPut('photolist',[...fs].map(f=>f.name));
  let voiceWarn='';
  if($('vc').files.length){
    voicePrepared=[];let budget=15;const notes=[],errs=[];
    for(const f of [...$('vc').files].slice(0,3)){
      const r=await prepVoice(f,budget);
      if(r.error){errs.push(r.error);continue}
      voicePrepared.push(r);budget-=r.dur;notes.push(f.name+' -> '+r.start.toFixed(1)+'-'+(r.start+r.dur).toFixed(1)+'s');
    }
    if(errs.length&&voicePrepared.length===0){msg('VOICE FAILED: '+errs.join(' | ')+' - fix or clear the voice field');return}
    if(notes.length)msg('voice trim: '+notes.join(' | '));
    if(errs.length)voiceWarn=' | VOICE WARNING: '+errs.join(' | ');
    await idbPut('voiceprep_meta',voicePrepared.map(r=>({name:r.name,start:r.start,dur:r.dur})));
    for(let i=0;i<voicePrepared.length;i++)await idbPut('voiceprep_'+i,voicePrepared[i].blob);
  }else{
    const meta=(await idbGet('voiceprep_meta'))||[];
    voicePrepared=(await Promise.all(meta.map(async(m,i)=>{const b=await idbGet('voiceprep_'+i);return b?{blob:b,...m}:null}))).filter(Boolean);
  }
  if(!photos.length)return msg('upload at least 1 grandpa photo');
  seed=Math.floor(Math.random()*2**31);
  $('setup').classList.add('hide');$('app').classList.remove('hide');
  msg2('ready - '+(photos.length)+' photos'+(voicePrepared.length?' + '+voicePrepared.length+' voice clip(s)':'')+voiceWarn);
};
function msg(t){$('setmsg').textContent=t}
function msg2(t){$('st').textContent=t}
if(fk&&ok&&localStorage.getItem('gp_pw')){$('fk').placeholder='fal key (saved)';$('ok_').placeholder='openrouter key (saved)'}

async function fupload(blob,name,mime){
  const up=await(await fetch(FALUP,{method:'POST',headers:{'Authorization':'Key '+fk,'Content-Type':'application/json'},
    body:JSON.stringify({file_name:name,content_type:mime})})).json();
  await fetch(up.upload_url,{method:'PUT',headers:{'Content-Type':mime},body:blob});
  return up.file_url;
}
async function ensureRefs(){
  if(refUrls)return;
  msg2('uploading '+photos.length+' reference photos...');
  refUrls=await Promise.all(photos.map((f,i)=>fupload(f,'ref'+i+'.jpg',f.type||'image/jpeg')));
  for(const r of voicePrepared)if(!r.blob||r.blob.type!=='audio/wav')throw new Error('internal: refusing to upload a non-wav voice clip to fal');
  voiceUrls=await Promise.all(voicePrepared.map((r,i)=>fupload(r.blob,'voice'+i+'.wav','audio/wav')));
}

$('lang').onclick=()=>{sttLang=sttLang==='ru'?'en':'ru';$('lang').textContent=sttLang==='ru'?'язык: РУС':'language: ENG'};
$('rec').onclick=async()=>{
  if(mr&&mr.state==='recording'){mr.stop();$('rec').textContent='⏳ transcribing...';return}
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];mr=new MediaRecorder(s);
  mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=async()=>{
    try{
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      const url=await fupload(blob,'shout.webm',blob.type);
      const j=await(await fetch(WIZ,{method:'POST',headers:{'Authorization':'Key '+fk,'Content-Type':'application/json'},
        body:JSON.stringify({audio_url:url,task:'transcribe',language:sttLang})})).json();
      if(!j.text)throw new Error(JSON.stringify(j).slice(0,200));
      pending=j.text.trim();$('tx').textContent='“'+pending+'”';
      $('ok').classList.remove('hide');$('no').classList.remove('hide');
    }catch(e){$('tx').textContent='STT error: '+e.message}
    $('rec').textContent='🎤 SHOUT AN IDEA / КРИЧИ ИДЕЮ';
  };
  mr.start();$('rec').textContent='🛑 TAP TO STOP';$('tx').textContent='Listening...';
  $('ok').classList.add('hide');$('no').classList.add('hide');
};
$('no').onclick=()=>{pending=null;$('tx').textContent='(transcript appears here - Russian and English both work / можно по-русски)';$('ok').classList.add('hide');$('no').classList.add('hide')};

const DIRECTOR=`You are the head comedy writer of a family birthday party video game. Guests shout absurd scenarios; you turn each into a 30-second mini-episode starring the birthday grandpa as the deadpan hero, and your writing makes a room full of family HOWL.
Comedy rules (this is what gets the laugh):
- One strong absurd premise, escalated with the Rule of Three: each 10-second beat raises the stakes or flips the expectation.
- Visual gags over dialogue. Grandpa REACTS - deadpan, supremely unbothered while chaos blooms around him. The comedy is the contrast.
- Specificity is funny: the exact ridiculous prop, the exact absurd detail (a silver thermos in the gun holster, slippers under the tuxedo).
- Punchline: the final beat lands a visual reversal. Optionally ONE short Russian line (<=12 words, dry, warm, grandfatherly wit). At most 2 chunks may have dialogue; many episodes need just one line total.
- Family-party tone: kids to grandma laugh. Warm, celebratory, absurd. Grandpa always wins. Never mean.
Structure:
- Exactly 3 chunks of ~10 seconds forming ONE continuous unbroken scene: setup, escalation, punchline.
- Every chunk prompt STARTS with the identical SETTING LOCK sentence (same vivid setting description, verbatim across all 3 chunks), then the words 'CONTINUITY: one continuous unbroken scene'.
- Chunk 1 ends mid-action: finish its prompt with 'END STATE: <exact final pose and camera position>'. Chunk 2's prompt begins the action from chunk 1's exact end state; chunk 2 ends with its own END STATE; chunk 3 picks up from it.
- Camera: one slow continuous move across the whole scene (e.g. slow push-in or slow pan), never cutting to a new setup.
- Refer to grandpa as 'the elderly man from the reference images' and demand exact face consistency in every chunk.
The shouted idea may be in Russian, English, or a mix - understand it in ANY language and build the episode around what was actually said. Write chunk prompts in English (the video model follows English best); dialogue_ru lines stay in natural spoken Russian.
Return ONLY JSON: {"title": str, "chunks": [{"prompt": str, "dialogue_ru": str|null}]}`;

$('ok').onclick=async()=>{
  const idea=pending;pending=null;
  $('ok').classList.add('hide');$('no').classList.add('hide');
  $('tx').textContent='🎬 Making it... chunk 1 in ~1 min, then 2 and 3 follow (each continues from the last frame)';
  try{
    let ep=null,lastErr=null,bestPartial=null;
    const conv=[{role:'system',content:DIRECTOR},{role:'user',content:'Shouted party idea: '+idea}];
    for(let attempt=0;attempt<3&&!ep;attempt++){
      try{
        const dj=await(await fetch(ORC,{method:'POST',headers:{'Authorization':'Bearer '+ok,'Content-Type':'application/json'},
          body:JSON.stringify({model:'google/gemini-3-flash-preview',temperature:1.0,response_format:{type:'json_object'},
            messages:conv})})).json();
        let p=JSON.parse(dj.choices[0].message.content);
        if(Array.isArray(p))p={title:null,chunks:p};
        const n=((p&&p.chunks)||[]).length;
        if(n>=1&&n<3&&(!bestPartial||n>((bestPartial.chunks||[]).length)))bestPartial=p;
        if(n!==3)throw new Error('director returned '+n+' chunks, need exactly 3');
        ep=p;
      }catch(e){
        lastErr=e;console.warn('director attempt '+(attempt+1)+' failed:',e);
        conv.push({role:'user',content:'Your last reply was invalid ('+e.message+'). Reply with ONLY the corrected JSON object: exactly 3 chunks for the SAME idea, nothing else.'});
      }
    }
    if(!ep&&bestPartial){ep=bestPartial;msg2('note: plot writer gave a short '+ep.chunks.length+'-chunk episode - still making it!')}
    if(!ep)throw new Error('plot writer failed 3 times: '+(lastErr&&lastErr.message));
    $('title').textContent='🎬 '+(ep.title||'Grandpa Party');
    await ensureRefs();
    chunkJobs=[];renderJobs();runEpisode((ep.chunks||[]).slice(0,3));
  }catch(e){$('tx').textContent='error: '+e.message}
};

async function lastFrameUrl(vurl){
  const v=document.createElement('video');v.crossOrigin='anonymous';v.src=vurl;v.muted=true;v.playsInline=true;v.preload='auto';
  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('frame video load failed'))});
  await new Promise((res,rej)=>{v.onseeked=res;v.onerror=rej;v.currentTime=Math.max(0,(v.duration||1)-0.1)});
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  return await fupload(blob,'prevframe.jpg','image/jpeg');
}
async function runEpisode(cs){
  let prevFrame=null;
  for(let i=0;i<cs.length;i++){
    genChunk(cs[i],i,prevFrame).catch(e=>{chunkJobs[i]=chunkJobs[i]||{};chunkJobs[i].state='failed';chunkJobs[i].err=e.message;renderJobs()});
    await new Promise(res=>{const t=setInterval(()=>{const j=chunkJobs[i];if(j&&(j.state==='ready'||j.state==='done'||j.state==='failed')){clearInterval(t);res()}},2000)});
    if(chunkJobs[i]&&(chunkJobs[i].state==='ready'||chunkJobs[i].state==='done')){
      try{prevFrame=await lastFrameUrl(chunkJobs[i].url)}catch(e){prevFrame=null}
    }else prevFrame=null;
  }
}
let chunkJobs=[];
function renderJobs(){
  $('chunks').innerHTML=chunkJobs.map((j,i)=>{
    if(!j)return '';
    let t='chunk '+(i+1)+': '+j.state+(j.err?' - '+j.err:'')+(j.reqId?' <span style="opacity:.5">['+j.reqId.slice(0,8)+']</span>':'');
    if(j.state==='failed')t+=' <a href="#" data-i="'+i+'" class=retry>RETRY FETCH (free)</a>';
    return '<div>'+t+'</div>';
  }).join('');
  $('chunks').querySelectorAll('.retry').forEach(a=>a.onclick=e=>{e.preventDefault();
    const i=+a.dataset.i;chunkJobs[i].state='fetching';chunkJobs[i].err='';renderJobs();pollJob(i);});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function genChunk(c,i,prevFrame){
  const imgs=prevFrame?[...refUrls,prevFrame]:refUrls;
  let p=("Images 1-"+refUrls.length+" all show the same elderly man (short neat gray hair, fair skin, stocky build, warm lined face). Keep his face EXACTLY consistent with the reference images in every shot. ")
    +(voiceUrls.length?"Audio 1-"+voiceUrls.length+" are his real voice: ALL spoken lines MUST use that exact voice, tone and cadence. ":"")
    +(prevFrame?("Image "+imgs.length+" is the exact final frame of the previous shot: the scene must continue seamlessly from that frame - identical setting, characters, lighting, camera position and camera motion, unbroken action. "):"")
    +c.prompt;
  if(c.dialogue_ru)p+=' He says, spoken entirely IN RUSSIAN (no English), natural lip-sync: "'+c.dialogue_ru+'"';
  const body={prompt:p,reference_image_urls:imgs,duration:10,resolution:'480P',aspect_ratio:'16:9',
    prompt_expansion_mode:'fast',seed};
  if(voiceUrls.length)body.reference_audio_urls=voiceUrls;
  const jr=await fetch(FAL+'/'+EP,{method:'POST',headers:{'Authorization':'Key '+fk,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const jtxt=await jr.text();
  let j;try{j=JSON.parse(jtxt)}catch(e){throw new Error('submit returned non-JSON (HTTP '+jr.status+'): '+jtxt.slice(0,200))}
  if(!jr.ok||!j.request_id)throw new Error('submit failed (HTTP '+jr.status+'): '+(j.detail||jtxt.slice(0,200)));
  chunkJobs[i]={reqId:j.request_id,statusUrl:j.status_url,responseUrl:j.response_url,state:'queued',err:''};
  try{sessionStorage.setItem('gp_job_'+i,JSON.stringify(chunkJobs[i]))}catch(e){}
  renderJobs();
  pollJob(i);
}
async function pollJob(i){
  const j=chunkJobs[i];if(!j)return;
  const t0=Date.now();
  while(Date.now()-t0<600000){
    await sleep(3000);
    let st;
    try{st=await(await fetch(j.statusUrl,{headers:{'Authorization':'Key '+fk}})).json()}
    catch(e){j.state='failed';j.err='status check failed: '+e.message;renderJobs();return}
    if(st.status==='COMPLETED'){
      if(st.error){j.state='failed';j.err=(st.error_type?st.error_type+': ':'')+st.error;renderJobs();return}
      try{
        const r=await fetch(j.responseUrl,{headers:{'Authorization':'Key '+fk}});
        const txt=await r.text();
        let out;try{out=JSON.parse(txt)}catch(e){throw new Error('non-JSON result (HTTP '+r.status+'): '+txt.slice(0,200))}
        if(!r.ok)throw new Error('HTTP '+r.status+': '+(out.detail||txt.slice(0,200)));
        const url=out&&out.video&&out.video.url;
        if(!url)throw new Error('result has no video.url: '+txt.slice(0,200));
        j.state='ready';j.url=url;j.err='';
        try{sessionStorage.setItem('gp_job_'+i,JSON.stringify(j))}catch(e){}
        renderJobs();pump();return;
      }catch(e){j.state='failed';j.err=e.message;renderJobs();return}
    }else if(st.status==='IN_QUEUE'||st.status==='IN_PROGRESS'){
      if(j.state!=='fetching'){j.state=st.status==='IN_QUEUE'?'queued':'rendering';renderJobs()}
    }else{
      j.state='failed';j.err='unexpected fal status: '+JSON.stringify(st).slice(0,200);renderJobs();return;
    }
  }
  j.state='failed';j.err='timeout after 10 min';renderJobs();
}
function pump(){
  if(playing)return;
  for(let i=0;i<chunkJobs.length;i++){
    const j=chunkJobs[i];
    if(!j||j.state==='done'||j.state==='failed')continue;
    if(j.state!=='ready')return;
    playing=true;j.state='done';renderJobs();
    const v=$('v');v.src=j.url;v.onended=()=>{playing=false;pump()};v.play().catch(()=>{playing=false});
    return;
  }
}
</script>
